[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mise-tools"
version = "0.1.0"
description = "PC companion tools for the Mise recipe app: LLM recipe converter and LAN server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "anthropic>=1.15,<2",
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14,<3",
  "jsonschema>=4.26",
  "watchfiles>=1.3",
  "segno>=1.6",
  "tomli>=2.0; python_version < '3.11'",
  "tomli-w>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx>=0.28"]

[project.scripts]
convert = "mise_converter.cli:main"
mise-server = "mise_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["shared/mise_shared", "converter/mise_converter", "server/mise_server"]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "converter/tests", "server/tests"]
addopts = "-q"
markers = ["live: calls the real Claude API (needs ANTHROPIC_API_KEY)"]
